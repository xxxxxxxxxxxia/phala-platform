[package]
name = "dcap-verify-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "verify_quote"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
hex = "0.4"
scale = { package = "parity-scale-codec", version = "3.6.5", default-features = false, features = ["derive"] }
scale-info = { version = "2", default-features = false, features = ["derive"] }
serde = { version = "1", default-features = false, features = ["derive"] }

# 密码学库
ring = { version = "0.16.20", default-features = false, features = ["alloc", "std"] }
webpki = { version = "0.22", default-features = false, features = ["alloc"] }

# 证书和编码
const-oid = { version = "0.9.2", default-features = false }
x509-cert = { version = "0.1", default-features = false }
pem = { version = "3", default-features = false }
asn1_der = { version = "0.7", default-features = false, features = ["native_types"] }
der = { version = "0.7.8", default-features = false, features = ["alloc"] }
byteorder = { version = "1.5.0", default-features = false }
chrono = { version = "0.4.31", default-features = false, features = ["alloc", "serde"] }
